name: Suggest a topic
description: Something about data analytics or AI you'd like to see tested, explained or compared.
title: "[Topic] "
labels: ["topic idea"]
body:
  - type: textarea
    id: topic
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters to you (optional)
      description: The problem you're trying to solve helps shape a useful answer.
