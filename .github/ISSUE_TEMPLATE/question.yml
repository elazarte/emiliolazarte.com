name: Ask a question
description: Something is unclear, or you want to know how it applies to your situation.
title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Which page is it about? (optional)
      placeholder: "e.g. Operating AI, Section 4"
